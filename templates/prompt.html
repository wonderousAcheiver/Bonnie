<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Interface</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/prompt.css') }}" />
  </head>
  <body>
    <div class="app-shell">
      <main class="workspace-layout" aria-label="Prompt interface">
        <section class="chat-window" aria-label="Prompt panel">
          <section class="output-panel" aria-label="AI output area">
            <div class="output-placeholder" id="output-placeholder">
              Results and generated text will appear here.
            </div>
            <p class="output-message" id="output-message" hidden></p>
            <div class="output-results" id="output-results" aria-live="polite"></div>
          </section>

          <form id="prompt-section" class="prompt-bar" aria-label="Prompt form">
            <label class="sr-only" for="prompt-input">Enter your prompt</label>
            <textarea
              id="prompt-input"
              name="prompt"
              rows="3"
              placeholder="Type your prompt here..."
            ></textarea>
            <button id="mic_button" type="button" class="mic-button" aria-label="Voice input" title="Voice input">
              <span aria-hidden="true">🎤</span>
            </button>
            <button type="submit" aria-label="Send prompt">Send</button>
          </form>
        </section>

        <aside class="details-panel" aria-label="Location details panel">
          <div class="details-header">
            <span class="details-kicker"></span>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" onclick="">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>

          <div class="details-visual" id="details-placeholder">
            <div class="planet-scene" id="planet-scene">
              <div class="planet-glow"></div>
              <div class="planet-orbit orbit-one"></div>
              <div class="planet-orbit orbit-two"></div>

              <div class="earth-wrap" aria-label="3D Earth">
                <canvas id="earth-canvas" width="500" height="500" aria-label="Earth globe"></canvas>
              </div>
            </div>
          </div>

          <div class="details-content" id="details-content" hidden></div>
        </aside>
      </main>
    </div>
    <script src="{{ url_for('static', filename='js/prompt.js') }}"></script>
  </body>
</html>
